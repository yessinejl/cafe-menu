<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0c0d11">
    <meta name="description" content="Menu digital officiel de Boscoffee - Consultez notre carte de cafés d'exception, thés, jus frais, crêpes, omelettes et formules petit-déjeuner.">
    <title>Boscoffee | Menu Digital & Salon de Thé</title>

    <!-- Google Fonts: Playfair Display, Great Vibes (titres script), Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Reflets d'ambiance dorés -->
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>

    <!-- En-tête / Header de Marque -->
    <header class="header">
        <div class="brand-container">
            <div class="logo-wrapper">
                <span class="logo-text">B<span class="bean-icon" aria-label="o"></span>scoffee</span>
            </div>
            <p class="brand-subtitle">COFFEE & LOUNGE • MENU</p>
        </div>

        <div class="header-actions">
            <button id="search-toggle-btn" class="icon-btn" aria-label="Rechercher" title="Rechercher">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>
    </header>

    <!-- Zone de recherche instantanée -->
    <div class="search-section" id="search-section">
        <div class="search-input-box">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" placeholder="Rechercher un café, crêpe, smoothie, formule..." autocomplete="off">
            <button id="clear-search-btn" class="clear-btn" aria-label="Effacer">✕</button>
        </div>
    </div>

    <!-- Navigation Filtres Rapides (Grands Univers) -->
    <nav class="macro-nav" aria-label="Groupes du menu">
        <button class="macro-btn active" data-group="all">✨ Tout le Menu</button>
        <button class="macro-btn" data-group="chaud">☕ Chauds & Thés</button>
        <button class="macro-btn" data-group="frais">🍹 Fraîcheurs & Jus</button>
        <button class="macro-btn" data-group="sucre">🥞 Gourmandises</button>
        <button class="macro-btn" data-group="sale">🍳 Salé & Formules</button>
    </nav>

    <!-- Barre défilante des 14 catégories du menu Boscoffee -->
    <div class="categories-bar-wrapper">
        <div class="categories" id="categories-container" role="tablist">
            <!-- Rendu dynamique par script.js -->
        </div>
    </div>

    <!-- Conteneur Principal du Menu -->
    <main class="menu-container" id="menu-container">
        <!-- Rendu dynamique des sections par script.js -->
    </main>

    <!-- Pied de Page -->
    <footer class="footer">
        <div class="footer-brand">
            <span class="footer-logo">Boscoffee</span>
            <p>Le goût de l'excellence à chaque tasse</p>
        </div>
        <div class="footer-details">
            <p class="service-note">☕ Service en salle & terrasse</p>
            <p class="currency-note">Tous les prix sont affichés en Dinars Tunisiens (DT)</p>
        </div>
        <div class="copyright">
            © 2026 Boscoffee. Menu Digital officiel par QR Code.
        </div>
    </footer>

    <!-- Script Logique & Données -->
    <script src="script.js"></script>
</body>
</html>
